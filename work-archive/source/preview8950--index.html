<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동화가든 히어로 영상 검토</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:#222;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header{padding:22px 24px 16px;border-bottom:1px solid #ddd}h1{font-size:22px;line-height:1.35;margin:0 0 14px;font-weight:650}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px;align-items:center}select,button{font:inherit;padding:6px 8px;border:1px solid #aaa;background:white;color:inherit;border-radius:0}button{cursor:pointer}
main{max-width:1000px;margin:24px auto;padding:0 24px}#meta{margin:0 auto 18px;max-width:800px}#productName{font-size:18px;margin:0 0 6px}#scene{margin:0;color:#555}#status{margin:6px 0;color:#777;font-size:13px}.preview{width:100%;max-width:800px;margin:auto}.preview.mobile{max-width:390px}
.pv-figma-intro-card{width:100%;margin:0;background:#fff;line-height:normal}
#assetLink{display:block;text-decoration:none}.pv-figma-intro-card__gif{display:block;width:100%;height:auto;aspect-ratio:16/9;margin:0;object-fit:contain;background:#000}
.pv-figma-intro-card__copy{margin:0;padding:15px 12px 30px;color:#9e9e9e;font-size:16px;font-weight:500;line-height:1.6;letter-spacing:-.035em;text-align:center;word-break:keep-all;white-space:nowrap}
#waiting{aspect-ratio:16/9;background:#f5f5f5;display:grid;place-items:center;color:#777}#waiting[hidden],#assetLink[hidden]{display:none}
footer{max-width:800px;margin:18px auto;padding-top:14px;border-top:1px solid #ddd;font-size:13px;color:#777}a{color:inherit}#fileLink{display:inline-block;margin-right:20px}
@media(max-width:600px){header{padding:16px}main{padding:0 12px;margin:18px auto}.pv-figma-intro-card__copy{font-size:clamp(12px,3.6vw,16px);white-space:normal}nav{gap:10px}label:first-child{width:100%}#productSelect{flex:1;min-width:0}}
</style>
</head>
<body>
<header><h1 id="pageTitle">동화가든 · 히어로 영상용 이미지</h1><nav>
<label>상품 <select id="productSelect" aria-label="상품 선택"></select></label>
<label>보기 <select id="sizeSelect" aria-label="미리보기 폭"><option value="desktop">PC 800px</option><option value="mobile">모바일 390px</option></select></label>
<button id="refresh" type="button">새로 확인</button>
</nav></header>
<main>
<div id="meta"><h2 id="productName"></h2><p id="scene"></p><p id="status" role="status"></p></div>
<div class="preview" id="preview">
<figure class="pv-figma-intro-card">
<a id="assetLink" hidden target="_blank" rel="noopener"><img id="heroImage" class="pv-figma-intro-card__gif" alt=""></a>
<video id="heroVideo" class="pv-figma-intro-card__gif" autoplay muted loop playsinline controls preload="metadata" hidden></video>
<div id="waiting">이미지 준비 중</div>
<figcaption id="caption" class="pv-figma-intro-card__copy"></figcaption>
</figure></div>
<footer><a id="fileLink" hidden target="_blank" rel="noopener">원본 이미지 열기</a><a id="promptLink" target="_blank" rel="noopener" style="margin-right:20px">생성 프롬프트</a><a href="shooting-notes.txt" target="_blank" rel="noopener">촬영 전달 메모</a><p id="mediaNote">16:9 · 영상 제작 전 정지 이미지 검토</p><p>이미지 아래 문구는 기존 상세페이지의 문구입니다. 상품명·동작 메모·검토 상태는 이 검토 화면에만 표시됩니다.</p></footer>
</main>
<script>
const ids=[32,33,34,35,36,37,39,40,41,42,43,44,45,46,47];
const names={32:"안송자 소고기 우거지 된장찌개",33:"육수가 필요 없는 안송자 토속 강된장 원액",34:"효자두유 190ml 15팩",35:"순·얼·비 세트",36:"순물 백김치 5kg",37:"안송자 청국장 키트",39:"국산콩 안송자 청국장 1kg",40:"순물 백김치 1kg",41:"국산콩 비지찌개",42:"원조짬뽕순두부 세트",43:"명품 순두부",44:"얼큰 순두부",45:"안송자 청국장찌개",46:"국산콩 비지찌개 5+1",47:"된장 고추지"};
const select=document.querySelector("#productSelect"),image=document.querySelector("#heroImage"),video=document.querySelector("#heroVideo"),preview=document.querySelector("#preview");
let products=ids.map(id=>({id,name:names[id],file:"images/product-"+id+".png",status:"이미지 준비 중"})),caps={},videos={},version="",renderKey="",loadCounter=0;
const query=new URLSearchParams(location.search);let selected=Number(query.get("product"))||42;
function fillOptions(){select.replaceChildren(...products.map(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.id+" · "+p.name;return o}));select.value=String(selected)}
function draw(force=false){
const p=products.find(p=>Number(p.id)===selected)||products[0];if(!p)return;
selected=Number(p.id);select.value=String(selected);
const v=videos[selected],hasVideo=!!(v&&v.status==="ready"&&new RegExp("^videos/product-"+selected+"\\.mp4$").test(v.file||""));
const key=JSON.stringify(p)+version+JSON.stringify(v||null);if(!force&&key===renderKey)return;renderKey=key;
const token=++loadCounter;
const a=document.querySelector("#assetLink"),f=document.querySelector("#fileLink"),w=document.querySelector("#waiting"),status=document.querySelector("#status");
const stillStatus=p.status==="ready"?"촬영 콘티 검수 완료":(p.status||"이미지 확인 중");
const models={seedance:"Seedance 2.0",wan:"Wan 2.7","bytedance/seedance-2.0":"Seedance 2.0","wan-video/wan-2.7-i2v":"Wan 2.7"};
const videoStatus=hasVideo?(v.duration||4)+"초 AI 영상 초안 · "+(models[v.model]||v.model||""):"";
document.querySelector("#productName").textContent=p.id+" · "+p.name;
document.querySelector("#scene").textContent=p.scene||"";
document.querySelector("#caption").textContent=p.caption??caps[p.id]??"";
const promptLink=document.querySelector("#promptLink");
const hasVideoPrompt=hasVideo&&/^video-prompts\/product-\d+\.txt$/.test(v.prompt_file||"");
promptLink.href=hasVideoPrompt?v.prompt_file:"prompts/product-"+p.id+"-attempt-"+(p.attempt||1)+".txt";
promptLink.textContent=hasVideoPrompt?"영상 생성 프롬프트":(hasVideo?"원본 이미지 프롬프트":"생성 프롬프트");
document.querySelector("#pageTitle").textContent=hasVideo?"동화가든 · 히어로 영상 초안":"동화가든 · 히어로 영상용 이미지";
document.querySelector("#mediaNote").textContent=hasVideo?"16:9 · "+(v.duration||4)+"초 AI 영상 초안":"16:9 · 영상 제작 전 정지 이미지 검토";
status.textContent=hasVideo?videoStatus:stillStatus;
a.hidden=true;f.hidden=true;w.hidden=false;w.textContent="이미지 준비 중";
video.pause();video.onloadeddata=null;video.onerror=null;video.hidden=true;video.removeAttribute("src");video.load();
const raw=p.file||"images/product-"+p.id+".png";
const src=raw.startsWith("/")?raw.replace(/^.*\/hero-generation-20261028\//,""):raw;
if(!/^(images|candidates)\//.test(src)){w.textContent="이미지 경로 확인 중";return}
function showStill(failedVideo=false){
image.onload=()=>{if(token!==loadCounter)return;a.hidden=false;f.hidden=false;w.hidden=true;status.textContent=failedVideo?"영상 재생 불가 · 정지 이미지":stillStatus;};
image.onerror=()=>{if(token!==loadCounter)return;a.hidden=true;f.hidden=true;w.hidden=false;w.textContent="이미지 준비 중";};
image.alt=p.name+" · "+(p.scene||"히어로 영상용 정지 이미지");
a.href=f.href=src;f.textContent="원본 이미지 열기";
image.src=src+"?v="+encodeURIComponent(version||Date.now());
}
if(!hasVideo){showStill();return}
w.hidden=false;w.textContent="영상 불러오는 중";video.hidden=true;video.poster=src;video.muted=true;video.setAttribute("aria-label",p.name+" · "+videoStatus);
f.hidden=false;f.href=v.file;f.textContent="원본 영상 열기";
video.onloadeddata=()=>{if(token!==loadCounter)return;video.hidden=false;w.hidden=true;status.textContent=videoStatus;video.play().catch(()=>{});};
video.onerror=()=>{if(token!==loadCounter)return;video.hidden=true;showStill(true);};
video.src=v.file+(v.revision?"?v="+encodeURIComponent(v.revision):"");video.load();video.play().catch(()=>{});
}
async function refresh(force=false){
const stamp=Date.now();
const results=await Promise.allSettled([
fetch("manifest.json?t="+stamp,{cache:"no-store"}).then(async r=>{if(!r.ok)return;const d=await r.json();products=(Array.isArray(d)?d:d.products)||products;products=products.filter(p=>ids.includes(Number(p.id)));version=d.updated_at||d.version||JSON.stringify(products);fillOptions();}),
fetch("video-manifest.json?t="+stamp,{cache:"no-store"}).then(async r=>{if(!r.ok)return;const d=await r.json();videos={};for(const v of (Array.isArray(d)?d:d.products)||[]){if(ids.includes(Number(v.id)))videos[Number(v.id)]=v;}})
]);
draw(force);
}
select.addEventListener("change",()=>{selected=Number(select.value);history.replaceState(null,"","?product="+selected);draw(true)});
document.querySelector("#sizeSelect").addEventListener("change",e=>preview.classList.toggle("mobile",e.target.value==="mobile"));
document.querySelector("#refresh").addEventListener("click",()=>refresh(true));
fetch("evidence/existing-captions.json").then(r=>r.json()).then(d=>{for(const x of d)caps[x.id]=x.caption;caps[36]=caps[40];caps[46]=caps[41];draw(true)}).catch(()=>{});
fillOptions();refresh();setInterval(()=>refresh(),5000);
</script>
</body></html>
